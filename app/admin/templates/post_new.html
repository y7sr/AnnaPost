{% extends "base.html" %}

{% block title %}New Post - AnnaPost Admin{% endblock %}

{% block content %}
<div class="card">
    <h2>New Post</h2>
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    
    <form action="/admin/posts/" method="post">
        <div class="form-group">
            <label for="account_id">Account</label>
            <select id="account_id" name="account_id">
                <option value="">Use Default Account</option>
                {% for account in accounts %}
                <option value="{{ account.id }}" {% if post and post.account_id == account.id %}selected{% endif %}>{{ account.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="media_type">Media Type</label>
            <select id="media_type" name="media_type">
                <option value="image" {% if post and post.media_type == 'image' %}selected{% endif %}>Image</option>
                <option value="reel" {% if post and post.media_type == 'reel' %}selected{% endif %}>Reel</option>
                <option value="carousel" {% if post and post.media_type == 'carousel' %}selected{% endif %}>Carousel</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="media_source_type">Media Source Type</label>
            <select id="media_source_type" name="media_source_type">
                <option value="url" {% if post and post.media_source_type == 'url' %}selected{% endif %}>URL</option>
                <option value="local_file" {% if post and post.media_source_type == 'local_file' %}selected{% endif %}>Local File</option>
                <option value="object_storage" {% if post and post.media_source_type == 'object_storage' %}selected{% endif %}>Object Storage</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="media_source">Media Source *</label>
            <input type="text" id="media_source" name="media_source" required value="{{ post.media_source if post else '' }}">
        </div>
        
        <div class="form-group">
            <label for="caption">Caption</label>
            <textarea id="caption" name="caption">{{ post.caption if post else '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="scheduled_at">Schedule for UTC (leave blank for draft)</label>
            <input type="datetime-local" id="scheduled_at" name="scheduled_at">
        </div>
        
        <div class="actions">
            <button type="submit">Create Post</button>
            <a href="/admin/posts/" class="button secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
